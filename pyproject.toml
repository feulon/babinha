[project]
name = "baba"
version = "0.1.0"
description = "Gerenciador do bába semanal de domingo"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "django-storages[s3]>=1.14",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9",
    "pytest-playwright>=0.6",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end browser tests (Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ", "PT", "RUF", "C4", "PIE", "RET"]
# Django's Meta/forms idioms use mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["baba", "accounts", "games", "fines", "finance", "board", "core", "matchday", "community", "demo"]
