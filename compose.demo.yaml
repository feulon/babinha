# Demo stack: the app with BABA_DEMO on (the game day schedule is released, a banner shows on every
# screen) plus its own Postgres and receipt store, filled with a fictitious baba. Nothing here
# needs a .env file and nothing is shared with compose.yaml, so both can run side by side.
#
#   docker compose -f compose.demo.yaml up --build
#
# Then open http://localhost:8100. Change the Sunday situation with, for example:
#   docker compose -f compose.demo.yaml exec app python manage.py demo times-confirmados --reset
#   docker compose -f compose.demo.yaml exec app python manage.py demo --listar
name: baba-domingo-demo

x-env: &env
  BABA_DEMO: "true"
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: demo-only-secret-key
  DJANGO_SECURE_COOKIES: "false"
  DJANGO_ALLOWED_HOSTS: ${DEMO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_URL: postgres://baba:baba-demo@db:5432/baba
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  BABA_S3_ENDPOINT_URL: http://s3:7070
  BABA_S3_BUCKET: baba-comprovantes
  BABA_S3_ACCESS_KEY_ID: baba
  BABA_S3_SECRET_ACCESS_KEY: baba-demo-secret

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: baba
      POSTGRES_USER: baba
      POSTGRES_PASSWORD: baba-demo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baba -d baba"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: versity/versitygw:v1.8.0
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/$$BUCKET && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY_ID: baba
      ROOT_SECRET_ACCESS_KEY: baba-demo-secret
      BUCKET: baba-comprovantes
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7070"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: baba-app:demo
    environment: *env
    ports:
      - "${DEMO_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Fills an empty database with the first situation (a full list with a waitlist) and exits.
  # It leaves a database that already has data alone, so restarting never erases your clicks.
  seed:
    image: baba-app:demo
    pull_policy: never
    environment:
      <<: *env
      BABA_MIGRATE_ON_START: "false"
    command: ["python", "manage.py", "demo", "--se-vazio"]
    restart: "no"
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  s3-data:
