# Local stack: app + Postgres + Mailpit (catches password-recovery e-mails) + an S3-compatible
# store for the Pix receipts.
name: baba

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: baba
      POSTGRES_USER: baba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baba}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baba -d baba"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Versity S3 Gateway: the S3 API over plain files, so every receipt is an ordinary file in
  # the s3-data volume (easy to back up, see the README). Any S3-compatible service (AWS S3,
  # Cloudflare R2, Backblaze B2, ...) can replace it through the BABA_S3_* variables.
  s3:
    image: versity/versitygw:v1.8.0
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/$$BUCKET && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY_ID: ${BABA_S3_ACCESS_KEY_ID:-baba}
      ROOT_SECRET_ACCESS_KEY: ${BABA_S3_SECRET_ACCESS_KEY:-baba-local-secret}
      BUCKET: ${BABA_S3_BUCKET:-baba-comprovantes}
    volumes:
      - s3-data:/data
    ports:
      - "${S3_PORT:-7070}:7070"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7070"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://baba:${POSTGRES_PASSWORD:-baba}@db:5432/baba
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-change-me}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      BABA_S3_ENDPOINT_URL: http://s3:7070
      BABA_S3_BUCKET: ${BABA_S3_BUCKET:-baba-comprovantes}
      BABA_S3_ACCESS_KEY_ID: ${BABA_S3_ACCESS_KEY_ID:-baba}
      BABA_S3_SECRET_ACCESS_KEY: ${BABA_S3_SECRET_ACCESS_KEY:-baba-local-secret}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  s3-data:
