{% comment %}Who is in a row of a team: one line per player, with the pote in small print and the E of a first-timer; needs `row`.{% endcomment %}
{% for player in row.players %}<span class="mate"><span class="mate__name">{{ player.name }}{% if player.pk in grouping.rookie_ids %}<span class="rk" role="img" aria-label="Estreante" title="Estreante: primeiro domingo no Babinha">E</span>{% endif %}</span><small class="mate__pote">P{{ player.pote }}</small></span>{% endfor %}
