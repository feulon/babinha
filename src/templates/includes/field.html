<div class="field{% if field.widget_type == 'checkbox' %} field--checkbox{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
