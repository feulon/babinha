<section class="recap" data-recap>
  <div class="recap__text">
    <p class="recap__eyebrow">Domingo encerrado</p>
    <p class="recap__title">Domingo, {{ hero_day.date|date:"d/m" }}</p>
  </div>
  <a class="btn btn--small btn--ghost recap__cta" href="{% url 'matchday:today' %}?next={{ next_url|urlencode:'' }}">Ver como foi o domingo</a>
</section>
